name: jagatoko
description: "Aplikasi kasir Jagatoko berbasis Supabase"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.15.4
  mobile_scanner: ^7.4.2
  pdf: ^3.11.3
  printing: ^5.14.3
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/jagatoko_logo.png
    - assets/images/logo_horizontal.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/jagatoko_logo.png"
  min_sdk_android: 23

